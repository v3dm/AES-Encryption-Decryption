<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Secure AES Cloud</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div id="login-view" class="centered-view">
    <div class="card login-card">
      <h2>Welcome Back</h2>
      <p class="small">Secure AES Encryption & Cloud Storage</p>
      
      <input id="email" type="email" placeholder="Email address" />
      <input id="password" type="password" placeholder="Password" style="margin-top:10px;" />
      
      <div style="display: flex; gap: 10px; margin-top: 10px;">
        <button id="btn-login">Log In</button>
        <button id="btn-signup" class="secondary">Sign Up</button>
      </div>
      <p id="auth-msg"></p>
    </div>
  </div>

  <div id="dashboard-view" class="container hidden">
    
    <div class="header">
      <h2>AES-Encryptor</h2>
      <div>
        <span id="user-display" class="user-badge">user@email.com</span>
        <button id="btn-logout" class="secondary" style="width: auto; margin: 0; margin-left: 10px; padding: 5px 12px;">Log Out</button>
      </div>
    </div>

    <div class="card">
      <h3>1. Encrypt Data</h3>
      <label>Message</label>
      <textarea id="plaintext" placeholder="Enter sensitive data..."></textarea>

      <label>Encryption Password</label>
      <input id="aes-password" type="password" placeholder="Set a secret key">

      <button id="btn-encrypt">Encrypt</button>

      <div style="margin-top: 20px; padding-top: 15px; border-top: 1px dashed #e2e8f0;">
        <label>Save to Database</label>
        <div style="display: flex; gap: 10px;">
            <input id="filenameInput" placeholder="Filename (e.g. keys.txt)">
            <input id="noteInput" placeholder="Note (Optional)">
        </div>
        <button id="btn-save" class="secondary">Save to Cloud</button>
      </div>
      
      <label>Ciphertext Result</label>
      <textarea id="ciphertext" readonly style="background:#f1f5f9;"></textarea>
    </div>

    <div class="card">
      <h3>2. Decrypt Data</h3>
      <label>Ciphertext</label>
      <textarea id="ciphertext_in" placeholder="Paste ciphertext string..."></textarea>

      <label>Encryption Password</label>
      <input id="aes-password_in" type="password" placeholder="Enter key used to encrypt">

      <button id="btn-decrypt">Decrypt</button>
      
      <label>Original Message</label>
      <textarea id="recovered" readonly style="background:#f1f5f9; color: #16a34a; font-weight:bold;"></textarea>
    </div>
  
  </div>

  <script src="/static/script.js"></script>
</body>
</html>
